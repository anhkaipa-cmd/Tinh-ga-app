name: Build ProAngle AI Camera Coach

on:
  push:
    branches:
      - ai-camera-coach-build
    paths:
      - 'AI_CAMERA_COACH/**'
      - '.github/workflows/build-ai-camera-coach.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: AI_CAMERA_COACH
        run: |
          sed -i 's/import android.view.SurfaceTexture;/import android.graphics.SurfaceTexture;/' app/src/main/java/com/proangle/ai/MainActivity.java
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProAngle-AI-Camera-Coach-APK
          path: AI_CAMERA_COACH/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

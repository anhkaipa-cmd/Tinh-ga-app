name: Build Tinh Ga APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply integrated calculator keypad
        run: python3 tools/patch_custom_keypad.py

      - name: Fix calculator keypad runtime crash
        run: python3 tools/fix_keypad_crash.py

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify sample weights and average
        run: |
          mkdir -p /tmp/tinh-ga-weight-test
          javac -d /tmp/tinh-ga-weight-test app/src/main/java/com/anhthu/tinhga/EggWeightValue.java tools/EggWeightValueTest.java
          java -cp /tmp/tinh-ga-weight-test EggWeightValueTest

      - name: Verify WLOSS week filename
        run: |
          mkdir -p /tmp/tinh-ga-wloss-test
          javac -d /tmp/tinh-ga-wloss-test app/src/main/java/com/anhthu/tinhga/WlossWeekName.java tools/WlossWeekNameTest.java
          java -cp /tmp/tinh-ga-wloss-test WlossWeekNameTest

      - name: Verify weighing Excel workbook
        run: |
          mkdir -p /tmp/tinh-ga-xlsx-test
          javac -d /tmp/tinh-ga-xlsx-test app/src/main/java/com/anhthu/tinhga/XlsxExporter.java tools/ExcelSmokeTest.java
          java -cp /tmp/tinh-ga-xlsx-test ExcelSmokeTest

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Tinh-ga.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tinh-ga-APK
          path: Tinh-ga.apk
          if-no-files-found: error
          retention-days: 30

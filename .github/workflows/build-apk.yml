name: Build Tinh Ga APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply integrated calculator keypad
        run: python3 tools/patch_custom_keypad.py

      - name: Fix calculator keypad runtime crash
        run: python3 tools/fix_keypad_crash.py

      - name: Remove parentheses keys
        run: python3 tools/remove_parentheses.py

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Tinh-ga.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tinh-ga-APK
          path: Tinh-ga.apk
          if-no-files-found: error
          retention-days: 30
